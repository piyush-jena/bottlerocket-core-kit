[Service]
# Full private-partition LUKS encryption (ephemeral-encryption-keys), WITH the
# nested datastore fscrypt layer kept for defense-in-depth.
#
# BOTTLEROCKET-PRIVATE is fully LUKS2-encrypted and the ext4 filesystem backing
# /.bottlerocket is freshly mkfs.ext4'd on the LUKS mapper device
# /dev/mapper/BOTTLEROCKET-PRIVATE on every boot (prepare-private-fs.service),
# which now enables the ext4 "encrypt" INCOMPAT feature at format time.
#
# The stock encrypt-datastore.service instead enables that feature at runtime
# via `tune2fs -O encrypt /dev/disk/by-partlabel/BOTTLEROCKET-PRIVATE`. Under
# full-LUKS PRIVATE that partlabel device is the LUKS *ciphertext* container
# (not an ext4 filesystem), so the tune2fs step is both wrong and dangerous:
# running it against the mounted mapper flips the filesystem read-only mid-boot
# (EROFS) and breaks the datastore/local-fs/storewolf/apiserver chain.
#
# So: reset the stock ExecStart list to drop the tune2fs step (the encrypt
# feature is already baked in at mkfs time) and keep only the fscrypt key
# generation + directory encryption. The "only if unencrypted" ExecCondition is
# already cleared by the 20-ephemeral drop-in so the datastore is re-encrypted
# under a freshly generated key every boot.
#
# The datastore key is held only in tmpfs (/run) via ROTTWEILER_KEYSTORE and is
# never written to persistent storage. It is regenerated every boot; /run is
# cleared on reboot, so key rotation is intrinsic.
#
# Ships only under the ephemeral-encryption-keys feature via the ephemeral-crypt
# subpackage; with the feature off this drop-in is absent and encrypt-datastore
# operates on the plaintext raw partition (with tune2fs) as before.
Environment=ROTTWEILER_KEYSTORE=/run/rottweiler
ExecStart=
ExecStart=/usr/bin/rottweiler generate-key datastore
ExecStart=/usr/bin/rottweiler encrypt directory ${DATASTORE_DIR} datastore
