[Mount]
# Ephemeral plain-mode DATA: mount the plain-mode dm-crypt mapper opened by
# encrypt-unlock-local-fs.service, not the raw partition. This mirrors the LUKS
# local-mount-encrypted.conf (10-encrypted.conf), but ships in the ephemeral set
# so an ephemeral image does not need the LUKS block-device drop-ins present.
What=/dev/mapper/BOTTLEROCKET-DATA
