[Unit]
# Encrypted-PRIVATE redirect: mount the LUKS mapper instead of the raw
# partition, and only after the partition has been encrypted, unlocked, and
# freshly formatted. Because encrypt/unlock/prepare-local-fs, encrypt/unlock-
# datastore, migrator, and storewolf all carry RequiresMountsFor=/.bottlerocket,
# ordering them after this mount guarantees they run after PRIVATE is unlocked.
After=unlock-private-fs.service prepare-private-fs.service
Requires=prepare-private-fs.service

[Mount]
What=/dev/mapper/BOTTLEROCKET-PRIVATE
