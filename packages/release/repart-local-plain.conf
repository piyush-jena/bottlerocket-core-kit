[Service]
# In ephemeral-encryption-keys mode the DATA partition grow and the dm-crypt
# mapper resize are performed inside encrypt-unlock-local-fs.service, so that the
# per-boot TPM-sealed key can be generated and deleted within that single
# service. Neutralize the base unit's systemd-repart grow here by resetting the
# ExecStart list (the empty assignment) and replacing it with a no-op.
#
# The no-op is required, not decorative: systemd refuses to load a service whose
# only remaining command is an ExecStartPost (the base unit's
# `systemd-growfs /local`), failing the boot with
#   repart-local.service: Service has no ExecStart=, ExecStop=, or SuccessAction=. Refusing.
# So we keep one valid ExecStart while still not running systemd-repart a second
# time against the raw partition underneath the already-open mapper. The base
# unit's ExecStartPost=systemd-growfs /local is left intact and still grows the
# filesystem to fill the resized mapper.
ExecStart=
ExecStart=/usr/bin/true
