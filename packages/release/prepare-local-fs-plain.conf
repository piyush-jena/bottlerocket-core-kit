[Unit]
# Ephemeral plain-mode DATA: prepare-local-fs must run after and be bound to the
# plain-mode open unit (encrypt-unlock-local-fs.service), which creates the
# /dev/mapper/BOTTLEROCKET-DATA mapper. This mirrors the LUKS
# prepare-local-fs-encrypted.conf (10-encrypted.conf) but binds to the plain-mode
# service instead of unlock-local-fs.service. Because the LUKS block-device units
# are absent on ephemeral images (they ship in the crypt-luks subpackage), no
# BindsTo/After reset is needed here -- the values are set directly.
BindsTo=encrypt-unlock-local-fs.service
After=encrypt-unlock-local-fs.service

[Service]
# mkfs the plain mapper, not the raw partition.
Environment=DATA_PARTITION_BLOCK_DEVICE=/dev/mapper/BOTTLEROCKET-DATA
