[Unit]
# Ephemeral plain-mode DATA: encrypt-unlock-local-fs.service now opens the
# /dev/mapper/BOTTLEROCKET-DATA mapper, creates its filesystem, masks the
# repart-data-* oneshots, grows the partition and resizes the mapper -- all
# within the single service where its per-boot TPM-sealed key exists. That makes
# this unit's own work redundant in plain mode, and its inherited
# `ln -s /dev/null ...repart-data-*.service` commands actively fail with
# "File exists" (encrypt-unlock-local-fs.service already created those masks),
# which failed prepare-local-fs.service and cascaded the whole boot to emergency.
# Bind to that unit for ordering and reduce this one to a no-op here.
BindsTo=encrypt-unlock-local-fs.service
After=encrypt-unlock-local-fs.service

[Service]
# Everything this unit used to do (makefs + repart-data masking) is handled by
# encrypt-unlock-local-fs.service in plain mode. Reset the inherited ExecStart
# list and replace it with a single no-op; systemd refuses a service that has no
# ExecStart=, ExecStop=, or SuccessAction=.
ExecStart=
ExecStart=/usr/bin/true
