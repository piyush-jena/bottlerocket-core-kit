[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_30"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.30"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-30/releases/57/artifacts/kubernetes/v1.30.14/kubernetes-src.tar.gz"
sha512 = "0b04948f1f2b714b97a578110d5b2e7593132a4a00d5938e9ba333137ff3fe0baf4c3bdeba4011eb5b1ec30d846497687b2fb6b6de5e14780de7ec4d134f159f"

[build-dependencies]
glibc = { path = "../glibc" }

