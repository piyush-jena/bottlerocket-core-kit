# systemd-boot boot manager configuration for Bottlerocket.
#
# Installed to <ESP>/loader/loader.conf, the only path systemd-boot reads, and
# only ever from the volume it was itself loaded from -- never from XBOOTLDR.
#
# Bottlerocket is an immutable, minimal, unattended appliance OS booting a
# single Unified Kernel Image from /EFI/Linux. There is no interactive user at
# the console, so the defaults below aim for "boot straight through, expose
# nothing extra, keep exactly one local recovery path."
#
# Keys and semantics verified against systemd v257.13 (src/boot/boot.c).
# Unknown keys are silently ignored by the parser, and a malformed value
# silently falls back to the compiled-in default, so only verified keys are
# used here. Note that this file is measured into TPM PCR 5 before parsing:
# editing it changes PCR 5 and invalidates anything sealed against it.

# Boot the default entry immediately, with no menu delay. The menu is still
# reachable by holding a key during firmware handoff, which is deliberate:
# `menu-disabled` would shave the key poll but would also remove the only
# local way to pick an older UKI when the newest one fails to boot.
timeout 0

# Leave the firmware-selected console text mode alone. This matches the
# compiled-in default; it is stated explicitly to avoid mode-switch flicker
# and to avoid depending on firmware mode enumeration on unknown platforms.
console-mode keep

# Disable the interactive kernel command line editor. This is the highest
# value key here: without Secure Boot, the editor lets anyone at the console
# append arbitrary kernel arguments (init=/bin/sh, disabling integrity
# features) to the UKI entry. The cost is that emergency cmdline debugging
# now requires replacing the UKI or using an out-of-band mechanism.
editor no

# Do not synthesize "other OS" menu entries. Most of these (Windows, macOS,
# EFI shell) can never exist here, but auto-efi-default is synthesized from
# the removable-media fallback \EFI\BOOT\BOOT<ARCH>.EFI, which Bottlerocket
# does ship. Suppressing it keeps the menu to the intended UKIs only.
auto-entries no

# Drop the "Reboot Into Firmware Interface" menu entry. Cosmetic only -- the
# `f` key still enters firmware setup -- so this is menu hygiene, not a
# security control.
auto-firmware no

# No "Power Off"/"Reboot The System" menu entries. These match the
# compiled-in defaults and are documentary: cheap insurance in case upstream
# ever flips them, since an appliance should never offer them.
auto-poweroff no
auto-reboot no

# No PC-speaker beeping during the countdown. Matches the compiled-in default
# and is a no-op on aarch64 anyway, but stated explicitly because beeping is
# pure noise on a headless server image.
beep no

# Never scan \loader\keys or enroll Secure Boot keys from the ESP. This one
# actually changes behavior: the compiled-in default is `if-safe`, which
# probes that directory on every boot and would auto-enroll a key set named
# `auto` inside a VM. Bottlerocket's Secure Boot keys are managed by the
# platform owner out of band, so in-guest enrollment is not wanted. Change
# this to `if-safe` only if an image is meant to self-enroll from
# \loader\keys\auto on first boot.
secure-boot-enroll off

# Deliberately not set:
#   default              - with a single UKI the first-suitable/newest-version
#                          fallback already picks it, and a hardcoded glob
#                          breaks when boot counting renames the file to
#                          name+2-1.efi.
#   reboot-for-bitlocker - inert without a Windows entry, and upstream marks
#                          it experimental.
